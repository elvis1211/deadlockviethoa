	<fontpattern>RadianceM-SemiBold</fontpattern>
	<fontpattern>RadianceM-Bold</fontpattern>
	<fontpattern>Reaver-Light</fontpattern>
	<fontpattern>Reaver-Regular</fontpattern>
	<fontpattern>Reaver-SemiBold</fontpattern>
	<fontpattern>Reaver-Bold</fontpattern>
	<fontpattern>Reaver-Black</fontpattern>
	<fontpattern>Creepster</fontpattern>
	<fontpattern>Rajdhani</fontpattern>
	<fontpattern>Quantico</fontpattern>
	<fontpattern>VT323</fontpattern>
	<fontpattern>Raju</fontpattern>	
	<fontpattern>raju-light</fontpattern>
	<fontpattern>raju-regular</fontpattern>
	<fontpattern>raju-semibold</fontpattern>
	<fontpattern>raju-bold</fontpattern>
	<fontpattern>raju-light-oblique</fontpattern>
	<fontpattern>raju-regular-oblique</fontpattern>
	<fontpattern>raju-semibold-oblique</fontpattern>
	<fontpattern>raju-bold-oblique</fontpattern>
	<fontpattern>NotoSansJP-Regular</fontpattern>
	<fontpattern>NotoSansJP-Medium</fontpattern>
	<fontpattern>NotoSansJP-Bold</fontpattern>
	<fontpattern>NotoSansJP-Black</fontpattern>
	<fontpattern>NotoSansJP-SemiBold</fontpattern>
	<fontpattern>NotoSansKR-Regular</fontpattern>
	<fontpattern>NotoSansKR-Medium</fontpattern>
	<fontpattern>NotoSansKR-Bold</fontpattern>
	<fontpattern>NotoSansKR-Black</fontpattern>
	<fontpattern>NotoSansKR-SemiBold</fontpattern>
	<fontpattern>NotoSansThai-Regular</fontpattern>
	<fontpattern>NotoSansThai-Bold</fontpattern>
	<fontpattern>NotoSansSC-Regular</fontpattern>
	<fontpattern>NotoSansSC-Medium</fontpattern>
	<fontpattern>NotoSansSC-Bold</fontpattern>
	<fontpattern>NotoSansSC-Black</fontpattern>
	<fontpattern>NotoSansSC-SemiBold</fontpattern>
	<fontpattern>NotoSansTC-Regular</fontpattern>
	<fontpattern>NotoSansTC-Bold</fontpattern>
	<fontpattern>RocknrollOne-Regular</fontpattern>
	<fontpattern>TetsubinGothic</fontpattern>
	<fontpattern>BlackHanSans-Regular</fontpattern>
	<fontpattern>Hahmlet-Medium</fontpattern>
	<fontpattern>Hahmlet-SemiBold</fontpattern>
	<fontpattern>Hahmlet-ExtraBold</fontpattern>
	<fontpattern>Ravenhook</fontpattern>
	<fontpattern>Ravenhook M</fontpattern>
	<fontpattern>Early-Bird-Regular</fontpattern>
	<fontpattern>early-bird-lowercase</fontpattern>
	<fontpattern>broadcast</fontpattern>
	<fontpattern>DINPro-Bold</fontpattern>
	<fontpattern>RetailDemo-Regular</fontpattern>
	<fontpattern>RetailDemo-Italic</fontpattern>
	<fontpattern>RetailDemo-Medium</fontpattern>
	<fontpattern>RetailDemo-MediumItalic</fontpattern>
	<fontpattern>RetailDemo-SemiBold</fontpattern>
	<fontpattern>RetailDemo-SemiBoldItalic</fontpattern>
	<fontpattern>RetailDemo-Bold</fontpattern>
	<fontpattern>RetailDemo-BoldItalic</fontpattern>
	<fontpattern>RetailTextDemo-Regular</fontpattern>
	<fontpattern>RetailTextDemo-Italic</fontpattern>
	<fontpattern>RetailTextDemo-Bold</fontpattern>
	<fontpattern>RetailTextDemo-BoldItalic</fontpattern>
	<fontpattern>VALVEPulp-Bold</fontpattern>
	<fontpattern>VALVEOracle-Thin</fontpattern>
	<fontpattern>VALVEOracle-ThinItalic</fontpattern>
	<fontpattern>VALVEOracle-Medium</fontpattern>
	<fontpattern>VALVEOracle-MediumItalic</fontpattern>
	<fontpattern>VALVEOracle-SemiBold</fontpattern>
	<fontpattern>VALVEOracle-SemiBoldItalic</fontpattern>
	<fontpattern>VALVEOracleThai-Thin</fontpattern>
	<fontpattern>VALVEOracleThai-ThinItalic</fontpattern>
	<fontpattern>VALVEOracleThai-Medium</fontpattern>
	<fontpattern>VALVEOracleThai-MediumItalic</fontpattern>
	<fontpattern>VALVEOracleThai-SemiBold</fontpattern>
	<fontpattern>VALVEOracleThai-SemiBoldItalic</fontpattern>
	<fontpattern>MarketDeco</fontpattern>
	<fontpattern>UnifrakturCook-Bold</fontpattern>
	<fontpattern>Grenze-Bold</fontpattern>
	<fontpattern>Bangers-Regular</fontpattern>
	<fontpattern>ravenhook</fontpattern>
	<fontpattern>Jost-Black</fontpattern>
	<fontpattern>Jost-BlackItalic</fontpattern>
	<fontpattern>Jost-Bold</fontpattern>
	<fontpattern>Jost-BoldItalic</fontpattern>
	<fontpattern>Jost-ExtraBold</fontpattern>
	<fontpattern>Jost-ExtraBoldItalic</fontpattern>
	<fontpattern>Jost-ExtraLight</fontpattern>
	<fontpattern>Jost-ExtraLightItalic</fontpattern>
	<fontpattern>Jost-Italic</fontpattern>
	<fontpattern>Jost-Light</fontpattern>
	<fontpattern>Jost-LightItalic</fontpattern>
	<fontpattern>Jost-Medium</fontpattern>
	<fontpattern>Jost-MediumItalic</fontpattern>
	<fontpattern>Jost-Regular</fontpattern>
	<fontpattern>Jost-SemiBold</fontpattern>
	<fontpattern>Jost-SemiBoldItalic</fontpattern>
	<fontpattern>Jost-Thin</fontpattern>
	<fontpattern>Jost-ThinItalic</fontpattern>

	<cachedir>WINDOWSTEMPDIR_FONTCONFIG_CACHE</cachedir>
	<cachedir>~/.fontconfig</cachedir>
	
	<!--
	LANGUAGES CODES

	"en-us"		"english"	
	"de-de"		"german"	
	"fr-fr"		"french"	
	"it-it"		"italian"	
	"ko-kr"		"koreana"	
	"es-es"		"spanish"	
	"zh-cn"		"schinese"	
	"zh-tw"		"tchinese"	
	"ru-ru"		"russian"	
	"th-th"		"thai"		
	"ja-jp"		"japanese"	
	"pt-pt"		"portuguese"
	"pl-pl"		"polish"	
	"da-dk"		"danish"	
	"nl-nl"		"dutch"	
	"fi-fi"		"finnish"	
	"no-no"		"norwegian"
	"sv-se"		"swedish"	
	"hu-hu"		"hungarian"
	"cs-cz"		"czech"	
	"ro-ro"		"romanian"	
	"tr-tr"		"turkish"	
	"pt-br"		"brazilian"
	"bg-bg"		"bulgarian"
	"el-gr"		"greek"	
	"uk-ua"		"ukrainian"
	"es-419"	"latam"	
	"vi-vn"		"vietnamese"
	"id-id"		"indonesian"
	-->
	
	<!-- per-country font replacements -->

	<match>
		<test name="family">
			<string>VALVEOracle</string>
		</test>
		<test name="lang">
			<string>th-th</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>VALVE Oracle Thai</string> 	<!-- TO-DO: Replace this with final font name -->
		</edit>
	</match>

	<!-- Use Noto Sans for Thai characters, but not for numbers and symbols -->

	<match>
		<test name="family">
			<string>Reaver</string>
		</test>
		<test name="lang">
			<string>th-th</string>
		</test>
		<edit name="family" mode="append_last" binding="strong">
			<string>Noto Sans Thai</string>
		</edit>
	</match>

	<!-- Use Noto Sans for Thai characters, but not for numbers and symbols -->
	<match>
		<test name="family">
			<string>Retail Text Demo</string>
		</test>
		<test name="lang">
			<string>th-th</string>
		</test>
		<edit name="family" mode="append_last" binding="strong">
			<string>Noto Sans Thai</string>
		</edit>
	</match>

	<match>
		<test name="family">
			<string>Radiance</string>
		</test>
		<test name="lang">
			<string>en-us</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Retail Demo</string>
		</edit>
	</match>

	<match>
		<test name="family">
			<string>Radiance</string>
		</test>
		<test name="lang">
			<string>id-id</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Retail Demo</string>
		</edit>
	</match>

	<match>
		<test name="family">
			<string>Radiance</string>
		</test>
		<test name="lang">
			<string>ja-jp</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Noto Sans JP</string>
		</edit>
	</match>

	<!-- Use Noto Sans for Thai characters, but not for numbers and symbols -->
	<match>
		<test name="family">
			<string>Radiance</string>
		</test>
		<test name="lang">
			<string>th-th</string>
		</test>
		<edit name="family" mode="append_last" binding="strong">
			<string>Noto Sans Thai</string>
		</edit>
	</match>


	<!-- Deadlock Vietnamese UI: narrow workaround for the Retail Demo family in English UI. -->
	<match target="pattern">
		<test name="family"><string>Retail Demo</string></test>
		<test name="lang"><string>en-us</string></test>
		<edit name="family" mode="assign" binding="strong"><string>Radiance</string></edit>
	</match>

	<!-- Keep Deadlock's original decorative faces. Add an in-game fallback for absent glyphs. -->
	<match target="pattern">
		<test name="family" compare="contains"><string>VALVEPulp</string></test>
		<edit name="family" mode="append_last" binding="strong"><string>Reaver</string></edit>
	</match>
	<match target="pattern">
		<test name="family" compare="contains"><string>Bangers</string></test>
		<edit name="family" mode="append_last" binding="strong"><string>Reaver</string></edit>
	</match>

	<!-- For Japanese prefer Noto Sans JP to Noto Sans SC. -->
	<match>
		<test name="lang">
			<string>ja-jp</string>
		</test>
		<test name="family" compare="contains">
			<string>notosans</string>
		</test>
		<edit name="family" mode="prepend">
			<string>Noto Sans JP</string>
		</edit>
	</match>

	<!-- CJK block and oracle font replacements -->
	<match>
		<test name="lang">
			<string>ja-jp</string>
		</test>
		<test name="family">
			<string>VALVEPulp</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>RocknRollOne</string>
		</edit>
	</match>

	<!-- Japanese: TetsubinGothic for semibold and heavier VALVEOracle, Noto Sans JP for lighter weights -->
	<match>
		<test name="lang">
			<string>ja-jp</string>
		</test>
		<test name="family">
			<string>VALVEOracle</string>
		</test>
		<test name="weight" compare="more_eq">
			<const>semibold</const>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>07TetsubinGothic</string>
		</edit>
	</match>
	<match>
		<test name="lang">
			<string>ja-jp</string>
		</test>
		<test name="family">
			<string>VALVEOracle</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Noto Sans JP</string>
		</edit>
	</match>
	<match>
		<test name="lang">
			<string>ko-kr</string>
		</test>
		<test name="family" compare="contains">
			<string>VALVEPulp</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>BlackHanSans</string>
		</edit>
	</match>
	<match>
		<test name="lang">
			<string>ko-kr</string>
		</test>
		<test name="family" compare="contains">
			<string>VALVEOracle</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Hahmlet</string>
		</edit>
	</match>
	<match>
		<test name="lang">
			<string>zh-cn</string>
		</test>
		<test name="family" compare="contains">
			<string>VALVEPulp</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Noto Sans SC</string>
		</edit>
		<edit name="weight" mode="assign" binding="strong">
			<const>black</const>
		</edit>
	</match>
	<match>
		<test name="lang">
			<string>zh-cn</string>
		</test>
		<test name="family" compare="contains">
			<string>VALVEOracle</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Noto Sans SC</string>
		</edit>
		<edit name="weight" mode="assign" binding="strong">
			<const>bold</const>
		</edit>
	</match>

	<!-- Use English font globally for elements using the numeric font families -->
		
	<match>
		<test name="family">
			<string>Gulim</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>VALVEOracle</string>
		</edit>
	</match>

	<match>
		<test name="family">
			<string>MingLiu</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>VALVEPulp</string>
		</edit>
	</match>
		
	<!-- Uncomment this to reject all bitmap fonts -->
	<!-- Make sure to run this as root if having problems:  fc-cache -f -->
	<!--
	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="scalable" >
					<bool>false</bool>
				</patelt>
			</pattern>
		</rejectfont>
	</selectfont>
	-->

	<!-- Ban Type-1 fonts because they render poorly -->
	<!-- Comment this out to allow all Type 1 fonts -->
	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="fontformat" >
					<string>Type 1</string>
				</patelt>
			</pattern>
		</rejectfont>
	</selectfont>

	<!-- Globally use embedded bitmaps in fonts like Calibri? -->
	<match target="font" >
		<edit name="embeddedbitmap" mode="assign">
			<bool>false</bool>
		</edit>
	</match>

	<!-- Substitute truetype fonts in place of bitmap ones? -->
	<match target="pattern" >
		<edit name="prefer_outline" mode="assign">
			<bool>true</bool>
		</edit>
	</match>

	<!-- Do font substitutions for the set style? -->
	<!-- NOTE: Custom substitutions in 42-repl-global.conf will still be done -->
	<!-- NOTE: Corrective substitutions will still be done -->
	<match target="pattern" >
		<edit name="do_substitutions" mode="assign">
			<bool>true</bool>
		</edit>
	</match>

	<!-- Make (some) monospace/coding TTF fonts render as bitmaps? -->
	<!-- courier new, andale mono, monaco, etc. -->
	<match target="pattern" >
		<edit name="bitmap_monospace" mode="assign">
			<bool>false</bool>
		</edit>
	</match>

	<!-- Force autohint always -->
	<!-- Useful for debugging and for free software purists -->
	<match target="font">
		<edit name="force_autohint" mode="assign">
			<bool>false</bool>
		</edit>
	</match>

	<!-- Set DPI.  dpi should be set in ~/.Xresources to 96 -->
	<!-- Setting to 72 here makes the px to pt conversions work better (Chrome) -->
	<!-- Some may need to set this to 96 though -->
	<match target="pattern">
		<edit name="dpi" mode="assign">
			<double>96</double>
		</edit>
	</match>

	<!-- Use Qt subpixel positioning on autohinted fonts? -->
	<!-- This only applies to Qt and autohinted fonts. Qt determines subpixel positioning based on hintslight vs. hintfull, -->
	<!--   however infinality patches force slight hinting inside freetype, so this essentially just fakes out Qt. -->
	<!-- Should only be set to true if you are not doing any stem alignment or fitting in environment variables -->
	<match target="pattern" >
		<edit name="qt_use_subpixel_positioning" mode="assign">
			<bool>false</bool>
		</edit>
	</match>

	<!-- Run infctl.sh or change the symlink in current directory instead of modifying this -->
	<include>../../../core/panorama/fonts/conf.d</include>

</fontconfig>
